mode: local-unless-ci
interval: 3
dictionaries:
  english-chinese-traditional:
    words:
      - flash
      - slash   # additional information inside features that makes it two lines long ((UK also oblique (stroke)))
      - record  # features in part of speech ([ T ]); phrase block
      - fuck    # features in .pos-header (offensive)
      - man     # contains suffix (-man) and plural (men)
      - reborn  # only phrase block in sense body (be reborn)
      - bug     # irreg-infls under phonemic transcription (-gg)
      - CPU     # .lab .usage inside div.def (abbreviation for)
      - corpus  # .ddivide cause extra spaces inside features (MEDICAL   specialized), plural (corpora)
      - un      # prefix (un-) and four entries
      - on the back of      # two idiom blocks
      - back-to-back        # a phrase block and an entry block
      - fuck around         # phrasal verb: two entry blocks (not phrase blocks) with pronunciation of fuck
      - creep up on someone # phrasal verb, url slug is "creep-up-on". see #13
      - in a nutshell       # only have an embedded phrae block in entry. see #14
      - back to back        # have a non-embedded entry but redirect to the embedded one. see #14
      - get low             # test slash and parenthesis (be/get/run low (on something)). see #14
      - make something of   # test comma and placeholder (make something, anything, etc. of sth/sb). see #14
      - mired in            # test slash, parenthesis, and placeholder (be/become mired (down) in sth). see #14
      - word: asdf
        error:
          type: DefinitionNotFoundError
      - word: slack off     # There's no entry in Chinese dictionary, it redirects to Cambridge Academic Content Dictionary.
        error:
          type: DefinitionRedirectedError
          attributes:
            redirected_word: slack off
            redirected_dictionary_id: english-academic-content

  english-chinese-simplified:
    words:
      - flash

  english-advanced-learner:
    words:
      - record        # Multiple pronunciations, embedded phrase block (for the record), image in sense's def-block
      - fuck          # Entry features in .pos-header (offensive), mixed idiom entry
      - reborn        # only phrase block in sense body (be reborn)
      - break the ice # idiom block
      - back to back  # phrase block and regular entry
      - fuck around   # phrasal verb
      - bode well     # collocation (structed like regular entry)
      - make of       # Embedded phrase block (make something, anything, etc. of sth/sb) PLUS regular entry (make something of someone)
      - word: in a nutshell # Only has english-academic-content dictionary
        error:
          type: DefinitionRedirectedError
          attributes:
            redirected_word: in a nutshell
            redirected_dictionary_id: english-academic-content
      - word: asdf
        error:
          type: DefinitionNotFoundError

  english-academic-content:
    words:
      - record        # Multiple pronunciations
      - break the ice # Idiom block
      - man           # runon block (manliness), plural (men), `.span.lab > span.usage` in sense definition
      - word: fuck    # Only has english-advanced-learner dictionary
        error:
          type: DefinitionRedirectedError
          attributes:
            redirected_word: fuck
            redirected_dictionary_id: english-advanced-learner
      - word: asdf
        error:
          type: DefinitionNotFoundError

  english-business-english:
    words:
      - record      # Multiple pronunciations, embedded phrase blocks (be a matter of (public) record, etc.), domain in `.ddef_h > .def-info`
      - word: fuck  # Only has english-advanced-learner dictionary
        error:
          type: DefinitionRedirectedError
          attributes:
            redirected_word: fuck
            redirected_dictionary_id: english-advanced-learner
      - word: asdf
        error:
          type: DefinitionNotFoundError
