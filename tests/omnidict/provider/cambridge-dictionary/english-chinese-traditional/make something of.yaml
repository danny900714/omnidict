  senses:
  - definition: to have an impression or an understanding about something
    examples:
    - sentence: Can you make anything of this information?
      translation: 你怎麼看這個消息？
    - sentence: What do you make of the new boss? (= What is your impression of her?)
      translation: 你認為新老闆如何？
