- headword: creep up on someone
  part_of_speech: phrasal verb
  pronunciations: null
  senses:
  - definition: If a feeling or state creeps up on you, you start to experience it
      so gradually that you do not realize it.
    examples:
    - sentence: It was only after I turned 60 that old age began to creep up on me.
      translation: 上了60歲之後，我才感覺自己在不知不覺中已開始變老了。
    features: null
    translation: 不知不覺中體驗到（某種情感或狀態）
